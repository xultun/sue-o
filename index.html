<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garra Control - Planificador de Gastos por Fecha</title>
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap');
        .font-tribuna { font-family: 'Montserrat', sans-serif; }
        
        #lista-gastos::-webkit-scrollbar {
            width: 5px;
        }
        #lista-gastos::-webkit-scrollbar-track {
            background: #F7F4EB;
            border-radius: 10px;
        }
        #lista-gastos::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen bg-[#F7F4EB] py-6 px-4 font-sans text-[#2A2A2A] flex items-center justify-center">

    <!-- DASHBOARD PRINCIPAL -->
    <div class="max-w-md w-full bg-[#FDFBF7] rounded-3xl shadow-xl border-2 border-[#E6DFCE] p-5 space-y-5 relative overflow-hidden">
        
        <!-- Franja Granate Top -->
        <div class="absolute top-0 left-0 right-0 h-3 bg-[#7A1C2E]"></div>

        <!-- Encabezado Principal -->
        <header class="flex items-center justify-between pt-2">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full bg-[#7A1C2E] flex items-center justify-center text-[#F7F4EB] font-black text-xl border-2 border-[#D4AF37] shadow-sm font-tribuna shrink-0">
                    U
                </div>
                <div>
                    <h1 class="text-lg font-black uppercase tracking-tight text-[#7A1C2E] font-tribuna">Garra Control</h1>
                    <p id="txt-saludo" class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Planificador de Gastos por Fecha</p>
                </div>
            </div>
            <div class="text-2xl text-[#D4AF37]">
                <i class="fas fa-calendar-check"></i>
            </div>
        </header>

        <!-- Resumen de Requerimiento Total -->
        <div class="bg-gradient-to-br from-[#7A1C2E] to-[#59121F] rounded-2xl p-4 text-[#F7F4EB] shadow-md border border-[#4D0F1A] space-y-2">
            <div class="flex justify-between items-center border-b border-[#D4AF37]/30 pb-2">
                <span class="text-xs uppercase tracking-wider font-extrabold text-[#D4AF37]">Total Requerido en Agenda</span>
                <span id="total-requerido" class="text-xl font-black font-tribuna text-white">S/ 0.00</span>
            </div>
            <div class="flex justify-between items-center pt-1 text-xs">
                <span class="text-gray-200">Garrita dice:</span>
                <span id="mascota-mensaje" class="font-bold text-[#D4AF37] italic">¡Organiza tus fechas para no quedar en offside! 🦁</span>
            </div>
        </div>

        <!-- FORMULARIO: Registrar / Programar Gasto por Fecha -->
        <div class="bg-white p-4 rounded-xl border border-[#E6DFCE] space-y-3 shadow-sm">
            <h2 class="text-xs font-extrabold text-[#7A1C2E] uppercase tracking-wider font-tribuna flex items-center justify-between">
                <span>➕ Programar Nuevo Pago / Gasto</span>
                <i class="fas fa-[#7A1C2E] fa-plus-circle"></i>
            </h2>

            <form id="form-gasto" class="space-y-2.5" onsubmit="event.preventDefault();">
                <!-- Categoría -->
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">Categoría</label>
                    <select id="categoria" class="w-full px-3 py-2 bg-[#F7F4EB] border border-[#E6DFCE] rounded-lg text-xs font-bold text-[#2A2A2A] focus:outline-none focus:ring-2 focus:ring-[#7A1C2E]">
                        <option value="🏠 Hogar / Servicios">🏠 Hogar / Servicios</option>
                        <option value="🍔 Alimentación / Gustos">🍔 Alimentación / Gustos</option>
                        <option value="🚌 Transporte">🚌 Transporte</option>
                        <option value="⚽ Estadio / Camisetas / Hinchada">⚽ Estadio / Camisetas / Hinchada</option>
                    </select>
                </div>

                <!-- Fecha y Monto -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">Fecha Límite / Pago</label>
                        <input type="date" id="fecha-pago" class="w-full px-2.5 py-2 bg-[#F7F4EB] border border-[#E6DFCE] rounded-lg text-xs font-bold text-[#2A2A2A] focus:outline-none focus:ring-2 focus:ring-[#7A1C2E]">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">Monto Necesario (S/)</label>
                        <input type="number" id="monto-pago" step="0.10" placeholder="0.00" class="w-full px-2.5 py-2 bg-[#F7F4EB] border border-[#E6DFCE] rounded-lg text-xs font-black text-[#7A1C2E] focus:outline-none focus:ring-2 focus:ring-[#7A1C2E]">
                    </div>
                </div>

                <!-- Descripción -->
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500 mb-1">Descripción / Concepto</label>
                    <input type="text" id="descripcion-pago" placeholder="Ej. Entrada Monumental, Recibo Luz, etc." class="w-full px-3 py-2 bg-[#F7F4EB] border border-[#E6DFCE] rounded-lg text-xs font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A1C2E]">
                </div>

                <button 
                    id="btn-agregar" 
                    type="button" 
                    class="w-full bg-[#7A1C2E] hover:bg-[#611422] active:scale-[0.98] text-[#F7F4EB] font-black py-2.5 rounded-lg transition-all shadow-md tracking-widest uppercase text-xs cursor-pointer border-b-4 border-[#4D0F1A] font-tribuna flex items-center justify-center space-x-2"
                >
                    <span>📌 Agendar en Calendario</span>
                    <i id="icono-loading" class="fas fa-spinner fa-spin hidden"></i>
                </button>
            </form>
        </div>

        <!-- CRONOGRAMA DE GASTOS POR FECHA -->
        <div class="space-y-2 pt-1 border-t border-[#E6DFCE]">
            <div class="flex justify-between items-center">
                <h3 class="text-[11px] font-black text-[#7A1C2E] uppercase tracking-wider font-tribuna">
                    📅 Cronograma de Gastos
                </h3>
                <span id="cant-items" class="text-[10px] bg-[#D4AF37] text-[#7A1C2E] font-black px-2 py-0.5 rounded-full">0 pendientes</span>
            </div>

            <div id="lista-gastos" class="max-h-56 overflow-y-auto space-y-2 pr-1">
                <!-- Inyección dinámica de ítems -->
            </div>
        </div>

        <!-- Botón de Limpieza -->
        <div class="text-center pt-1">
            <button 
                id="btn-limpiar" 
                type="button"
                class="text-[9px] text-gray-400 hover:text-red-600 font-bold transition-colors uppercase tracking-wider cursor-pointer"
            >
                <i class="fas fa-trash-alt mr-1"></i> Borrar Todo el Cronograma
            </button>
        </div>

    </div>

    <script>
        // CONFIGURACIÓN GOOGLE SHEETS (Coloca la URL desplegada de tu Apps Script)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytjfdB9LCebtQSW3mVVJplSXw2yqls8lM4yWn5u-AzmGRyrK_11P_9UVVrwJscfbcjZA/exec";

        const KEY_GASTOS = 'garra_gastos_agenda_v1';
        let agendaGastos = JSON.parse(localStorage.getItem(KEY_GASTOS)) || [];

        // Referencias DOM
        const categoriaInput = document.getElementById('categoria');
        const fechaPagoInput = document.getElementById('fecha-pago');
        const montoPagoInput = document.getElementById('monto-pago');
        const descripcionPagoInput = document.getElementById('descripcion-pago');
        const btnAgregar = document.getElementById('btn-agregar');
        const iconoLoading = document.getElementById('icono-loading');
        const listaGastos = document.getElementById('lista-gastos');
        const totalRequeridoEl = document.getElementById('total-requerido');
        const cantItemsEl = document.getElementById('cant-items');
        const btnLimpiar = document.getElementById('btn-limpiar');

        // Establecer fecha de hoy por defecto en el input
        fechaPagoInput.value = new Date().toISOString().split('T')[0];

        function actualizarVista() {
            // Ordenar gastos cronológicamente por fecha de pago
            agendaGastos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            localStorage.setItem(KEY_GASTOS, JSON.stringify(agendaGastos));

            listaGastos.innerHTML = '';
            let sumaTotal = 0;

            if (agendaGastos.length === 0) {
                listaGastos.innerHTML = `<p class="text-gray-400 text-center py-6 italic text-[11px]">No tienes gastos agendados. ¡Empieza a programar tus fechas!</p>`;
            } else {
                agendaGastos.forEach((gasto, index) => {
                    sumaTotal += parseFloat(gasto.monto);

                    // Formatear fecha legible
                    const partesFecha = gasto.fecha.split('-');
                    const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

                    const card = document.createElement('div');
                    card.className = "bg-white p-3 rounded-xl border border-[#E6DFCE] shadow-sm flex justify-between items-center hover:border-[#D4AF37] transition-all";
                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-black bg-[#F7F4EB] text-[#7A1C2E] px-2 py-0.5 rounded border border-[#E6DFCE]">${gasto.categoria}</span>
                                <span class="text-[10px] font-bold text-gray-500"><i class="far fa-calendar-alt mr-1"></i>${fechaFormateada}</span>
                            </div>
                            <p class="font-bold text-[#2A2A2A] text-xs leading-tight">${gasto.descripcion || 'Sin descripción'}</p>
                        </div>
                        <div class="text-right flex items-center space-x-2">
                            <div>
                                <span class="text-xs font-black text-[#7A1C2E] font-tribuna block">S/ ${parseFloat(gasto.monto).toFixed(2)}</span>
                            </div>
                            <button onclick="eliminarGasto(${index})" class="text-gray-300 hover:text-red-500 text-xs p-1">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                    listaGastos.appendChild(card);
                });
            }

            totalRequeridoEl.textContent = `S/ ${sumaTotal.toFixed(2)}`;
            cantItemsEl.textContent = `${agendaGastos.length} pendiente(s)`;
        }

        async function sincronizarGoogleSheets(nuevoGasto) {
            if (!SCRIPT_URL || SCRIPT_URL.includes("REEMPLAZA_CON_TU_URL")) {
                console.warn("Falta colocar la URL de Apps Script en SCRIPT_URL");
                return;
            }

            try {
                iconoLoading.classList.remove('hidden');
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "add",
                        usuario: "Luis",
                        categoria: nuevoGasto.categoria,
                        fechaPago: nuevoGasto.fecha,
                        monto: nuevoGasto.monto,
                        descripcion: nuevoGasto.descripcion
                    })
                });
            } catch (err) {
                console.error("Error al sincronizar con Sheets:", err);
            } finally {
                iconoLoading.classList.add('hidden');
            }
        }

        btnAgregar.addEventListener('click', async () => {
            const cat = categoriaInput.value;
            const fecha = fechaPagoInput.value;
            const monto = parseFloat(montoPagoInput.value);
            const desc = descripcionPagoInput.value.trim();

            if (!fecha) {
                alert("Por favor selecciona una fecha límite.");
                return;
            }

            if (isNaN(monto) || monto <= 0) {
                alert("Por favor ingresa un monto válido.");
                return;
            }

            const nuevoGasto = {
                categoria: cat,
                fecha: fecha,
                monto: monto,
                descripcion: desc
            };

            agendaGastos.push(nuevoGasto);
            actualizarVista();

            // Limpiar inputs
            montoPagoInput.value = '';
            descripcionPagoInput.value = '';

            // Sincronizar en segundo plano con Google Sheets
            await sincronizarGoogleSheets(nuevoGasto);
        });

        function eliminarGasto(index) {
            agendaGastos.splice(index, 1);
            actualizarVista();
        }

        btnLimpiar.addEventListener('click', () => {
            if (confirm("¿Deseas borrar toda la agenda de gastos local?")) {
                agendaGastos = [];
                actualizarVista();
            }
        });

        // Inicializar vista
        actualizarVista();
    </script>
</body>
</html>
